[project]
name = "flarewatch"
version = "0.1.0"
description = "FlareWatch ingest worker: NASA FIRMS VIIRS detections -> sites, stats, classification, activity changes"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flarewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
