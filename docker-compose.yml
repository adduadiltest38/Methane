services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: flarewatch
      POSTGRES_PASSWORD: flarewatch
      POSTGRES_DB: flarewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flarewatch -d flarewatch"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
