name: Ingest

on:
  schedule:
    # Every 3 hours at minute 17: GitHub delays or drops many jobs scheduled on the hour.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Worker command"
        type: choice
        options: [run, backfill, process, countries]
        default: run
      days:
        description: "Days to backfill (backfill only)"
        default: "90"

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install worker
        working-directory: worker
        run: pip install .
      - name: Apply migrations
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          ./db/migrate.sh
      - name: Export country borders (countries only)
        if: github.event.inputs.command == 'countries'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node scripts/export-countries.mjs ../data/countries.geojson

      - name: Run worker
        working-directory: worker
        env:
          COMMAND: ${{ github.event.inputs.command || 'run' }}
          DAYS: ${{ github.event.inputs.days || '90' }}
        run: |
          if [ "$COMMAND" = "backfill" ]; then
            python -m flarewatch.cli backfill --days "$DAYS"
          elif [ "$COMMAND" = "countries" ]; then
            mkdir -p ../data
            python -m flarewatch.cli load-countries ../data/countries.geojson
          else
            python -m flarewatch.cli "$COMMAND"
          fi
