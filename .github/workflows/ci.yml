name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: flarewatch
          POSTGRES_PASSWORD: flarewatch
          POSTGRES_DB: flarewatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U flarewatch"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://flarewatch:flarewatch@localhost:5432/flarewatch
      TEST_DATABASE_URL: postgresql://flarewatch:flarewatch@localhost:5432/flarewatch
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations apply cleanly (twice, idempotent)
        run: |
          ../db/migrate.sh
          ../db/migrate.sh
      - name: Tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  banned-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Banned-words check
        env:
          # Optional newline-separated list of operator names, kept out of the repo.
          BANNED_OPERATOR_NAMES: ${{ secrets.BANNED_OPERATOR_NAMES }}
        run: ./ci/check_banned_words.sh
